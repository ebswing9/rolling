<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>롤링페이퍼 관리자</title>
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="pdf-templates.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- 접근 잠금 화면 -->
<div id="lockScreen" class="rp-shell" style="max-width:400px; padding-top:80px;">
  <div class="rp-brand" style="justify-content:center;">
    <span class="mark">🔒</span>
    <h1>관리자 확인</h1>
  </div>
  <div class="rp-card-box">
    <div class="rp-field">
      <label>관리자 비밀번호</label>
      <input type="password" id="lockPasswordInput" autocomplete="off" />
    </div>
    <button class="rp-btn primary block" id="lockConfirmBtn">들어가기</button>
    <p class="rp-error" id="lockError"></p>
  </div>
</div>

<div class="rp-shell wide" id="adminMain" style="display:none;">
  <div class="rp-brand">
    <span class="mark">🗂️</span>
    <h1>롤링페이퍼 관리자</h1>
    <span class="sub">교사용</span>
  </div>

  <div class="rp-toggle-line">
    <div>
      <strong>학생 작성 기간</strong>
      <p>켜져 있는 동안에만 학생들이 롤링페이퍼를 작성할 수 있어요.</p>
    </div>
    <button class="rp-switch" id="openSwitch"></button>
  </div>

  <div class="rp-tabs">
    <button class="rp-tab active" data-tab="roster">명단 관리</button>
    <button class="rp-tab" data-tab="byWriter">작성자별 모아보기</button>
    <button class="rp-tab" data-tab="byRecipient">수신자별 모아보기</button>
    <button class="rp-tab" data-tab="pdf">PDF 내보내기</button>
  </div>

  <!-- 명단 관리 -->
  <div class="rp-panel active" id="panel-roster">
    <div class="rp-card-box" style="margin-bottom:16px;">
      <div class="rp-row" style="margin-bottom:12px;">
        <input type="text" id="newStudentName" class="rp-input" placeholder="학생 이름 입력" style="flex:1;" />
        <button class="rp-btn primary" id="addStudentBtn">추가</button>
      </div>
      <div class="rp-row wrap" style="border-top:1.5px dashed var(--rp-line); padding-top:12px;">
        <label class="rp-btn ghost rp-mini" style="cursor:pointer; margin:0;">
          📤 CSV로 한번에 업로드
          <input type="file" id="csvUploadInput" accept=".csv,text/csv" style="display:none;" />
        </label>
        <button class="rp-btn ghost rp-mini" id="csvDownloadBtn">📥 현재 명단 CSV 다운로드</button>
      </div>
      <p class="rp-error" id="csvStatus" style="color:var(--rp-ink-soft); font-weight:500;"></p>
    </div>
    <div class="rp-card-box">
      <table class="rp-table" id="rosterTable">
        <thead>
          <tr><th>이름</th><th>비밀번호 설정 여부</th><th></th></tr>
        </thead>
        <tbody id="rosterTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- 작성자별 모아보기 -->
  <div class="rp-panel" id="panel-byWriter">
    <div class="rp-card-box">
      <div class="rp-field">
        <label>학생 선택 (작성자)</label>
        <select id="writerSelect"></select>
      </div>
      <div id="writerResult"></div>
    </div>
  </div>

  <!-- 수신자별 모아보기 -->
  <div class="rp-panel" id="panel-byRecipient">
    <div class="rp-card-box">
      <div class="rp-field">
        <label>학생 선택 (수신자)</label>
        <select id="recipientSelect"></select>
      </div>
      <div id="recipientResult"></div>
    </div>
  </div>

  <!-- PDF 내보내기 -->
  <div class="rp-panel" id="panel-pdf">
    <div class="rp-card-box" style="margin-bottom:16px;">
      <div class="rp-field">
        <label>디자인 템플릿</label>
        <select id="templateSelect"></select>
      </div>
      <div class="rp-field">
        <label>작성자 이름 표시</label>
        <select id="nameDisplaySelect">
          <option value="real">실명 표시</option>
          <option value="anon">전체 익명 처리</option>
        </select>
      </div>
      <div class="rp-field" style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <input type="checkbox" id="fillMissingCheckbox" style="width:18px; height:18px; accent-color:var(--rp-pink-deep);" />
        <label for="fillMissingCheckbox" style="margin:0; cursor:pointer;">미작성자도 같은 문구로 채워서 내보내기</label>
      </div>
      <div class="rp-field" id="fillMissingTextWrap" style="display:none;">
        <label>미작성자에게 채울 문구</label>
        <textarea id="fillMissingText" maxlength="200" placeholder="예: 항상 네가 잘 지내기를 바랄게!"></textarea>
      </div>
    </div>

    <div class="rp-card-box" style="margin-bottom:16px;">
      <h3 class="rp-panel-heading">📄 개별 학생 PDF 다운로드</h3>
      <div class="rp-row">
        <select id="pdfSingleSelect" class="rp-input" style="flex:1;"></select>
        <button class="rp-btn primary" id="pdfSingleBtn">다운로드</button>
      </div>
      <p class="rp-error" id="pdfSingleStatus" style="color:var(--rp-ink-soft); font-weight:500;"></p>
    </div>

    <div class="rp-card-box">
      <h3 class="rp-panel-heading">📦 반 전체 일괄 내보내기</h3>
      <p style="font-size:13px; color:var(--rp-ink-soft); margin-top:0;">받은 메시지가 있는 학생들을 모아 학생별로 페이지가 이어지는 PDF 한 개로 만들어요.</p>
      <button class="rp-btn sage block" id="pdfBatchBtn">전체 일괄 다운로드</button>
      <p class="rp-error" id="pdfBatchStatus" style="color:var(--rp-ink-soft); font-weight:500;"></p>
    </div>
  </div>
</div>

<script type="module">
import {
  watchIsOpen,
  setIsOpen,
  watchRoster,
  addStudent,
  addStudentsBulk,
  removeStudent,
  hasPassword,
  resetPassword,
  getWrittenBy,
  getMessage,
  getMessagesFor,
} from "./rolling-common.js";
import { TEMPLATES, exportSingle, exportBatch } from "./pdf-export.js";

const $ = (id) => document.getElementById(id);

// ---------- 접근 잠금 ----------
// 완벽한 보안은 아니고(페이지 소스를 보면 비밀번호가 보여요), 아무나
// URL만 알면 바로 못 들어오게 막는 최소한의 장치예요.
// 실제 사용 전에 아래 비밀번호를 원하는 값으로 바꿔주세요.
const ADMIN_PASSWORD = "sugar";

function unlockAdmin() {
  sessionStorage.setItem("rp_admin_unlocked", "1");
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("adminMain").style.display = "";
  initAdminApp();
}

document.getElementById("lockConfirmBtn").onclick = () => {
  const input = document.getElementById("lockPasswordInput").value;
  if (input === ADMIN_PASSWORD) {
    unlockAdmin();
  } else {
    document.getElementById("lockError").textContent = "비밀번호가 맞지 않아요.";
  }
};

document.getElementById("lockPasswordInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("lockConfirmBtn").click();
});

if (sessionStorage.getItem("rp_admin_unlocked") === "1") {
  unlockAdmin();
}

function initAdminApp() {
let roster = {};
let isOpenState = false;

// ---------- 탭 전환 ----------
document.querySelectorAll(".rp-tab").forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll(".rp-tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".rp-panel").forEach((p) => p.classList.remove("active"));
    tab.classList.add("active");
    $(`panel-${tab.dataset.tab}`).classList.add("active");
  };
});

// ---------- 작성 기간 토글 ----------
watchIsOpen((isOpen) => {
  isOpenState = isOpen;
  $("openSwitch").classList.toggle("on", isOpen);
});
$("openSwitch").onclick = async () => {
  await setIsOpen(!isOpenState);
};

// ---------- 명단 실시간 반영 ----------
watchRoster(async (r) => {
  roster = r;
  await renderRosterTable();
  renderSelect($("writerSelect"), roster);
  renderSelect($("recipientSelect"), roster);
  renderSelect($("pdfSingleSelect"), roster);
});

function renderSelect(selectEl, r) {
  const prev = selectEl.value;
  selectEl.innerHTML = Object.entries(r)
    .sort((a, b) => a[1].name.localeCompare(b[1].name, "ko"))
    .map(([id, s]) => `<option value="${id}">${s.name}</option>`)
    .join("");
  if (prev && r[prev]) selectEl.value = prev;
}

async function renderRosterTable() {
  const rows = await Promise.all(
    Object.entries(roster)
      .sort((a, b) => a[1].name.localeCompare(b[1].name, "ko"))
      .map(async ([id, s]) => {
        const has = await hasPassword(id);
        return `<tr>
          <td>${s.name}</td>
          <td>${has ? "✅ 설정됨" : "미설정"}</td>
          <td>
            <button class="rp-btn ghost rp-mini" data-action="reset" data-id="${id}">비밀번호 초기화</button>
            <button class="rp-btn ghost rp-mini" data-action="remove" data-id="${id}">삭제</button>
          </td>
        </tr>`;
      })
  );
  $("rosterTableBody").innerHTML = rows.join("");
  $("rosterTableBody").querySelectorAll("button[data-action]").forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      if (btn.dataset.action === "reset") {
        await resetPassword(id);
        alert(`${roster[id].name} 학생의 비밀번호가 초기화되었습니다. 다음 접속 때 새로 설정하게 됩니다.`);
        renderRosterTable();
      } else if (btn.dataset.action === "remove") {
        if (confirm(`${roster[id].name} 학생을 명단과 관련 데이터에서 삭제할까요?`)) {
          await removeStudent(id);
        }
      }
    };
  });
}

$("addStudentBtn").onclick = async () => {
  const name = $("newStudentName").value.trim();
  if (!name) return;
  await addStudent(name);
  $("newStudentName").value = "";
};

// ---------- CSV 업로드 / 다운로드 ----------
function parseCsvNames(text) {
  return text
    .split(/\r?\n/)
    .map((line) => line.split(",")[0].trim()) // 첫 번째 칸을 이름으로 사용
    .filter((name) => name && name !== "이름" && name !== "name");
}

$("csvUploadInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("csvStatus").textContent = "업로드 중...";
  try {
    const text = await file.text();
    const names = parseCsvNames(text);
    const added = await addStudentsBulk(names);
    $("csvStatus").textContent = `${names.length}명 중 ${added}명을 새로 추가했어요. (이미 있는 이름은 건너뜀)`;
  } catch (err) {
    console.error(err);
    $("csvStatus").textContent = "CSV를 읽는 중 오류가 발생했어요.";
  } finally {
    e.target.value = "";
  }
});

$("csvDownloadBtn").onclick = () => {
  const names = Object.values(roster)
    .map((s) => s.name)
    .sort((a, b) => a.localeCompare(b, "ko"));
  const csv = "이름\n" + names.join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "롤링페이퍼_명단.csv";
  a.click();
  URL.revokeObjectURL(url);
};

// ---------- 작성자별 모아보기 ----------
$("writerSelect").onchange = renderWriterResult;
watchRoster(() => renderWriterResult()); // 명단 바뀔 때도 갱신

async function renderWriterResult() {
  const fromId = $("writerSelect").value;
  if (!fromId || !roster[fromId]) return;
  const written = await getWrittenBy(fromId);
  const others = Object.entries(roster).filter(([id]) => id !== fromId);
  const items = await Promise.all(
    others
      .sort((a, b) => a[1].name.localeCompare(b[1].name, "ko"))
      .map(async ([toId, s]) => {
        const done = !!written[toId];
        let preview = "";
        if (done) {
          const msg = await getMessage(fromId, toId);
          preview = msg ? `<div class="rp-msg-preview"><div class="content">${escapeHtml(msg.content)}</div></div>` : "";
        }
        return `<div class="rp-roster-item ${done ? "done" : ""}" style="cursor:default;">
          <span>${s.name}</span>
          <span class="rp-badge ${done ? "done" : "todo"}">${done ? "작성함" : "미작성"}</span>
        </div>${preview}`;
      })
  );
  $("writerResult").innerHTML = `<div class="rp-roster-list">${items.join("")}</div>`;
}

// ---------- 수신자별 모아보기 ----------
$("recipientSelect").onchange = renderRecipientResult;

async function renderRecipientResult() {
  const toId = $("recipientSelect").value;
  if (!toId || !roster[toId]) return;
  const messages = await getMessagesFor(toId);
  const entries = Object.entries(messages);
  if (entries.length === 0) {
    $("recipientResult").innerHTML = `<div class="rp-empty">아직 받은 메시지가 없어요.</div>`;
    return;
  }
  $("recipientResult").innerHTML = entries
    .map(([fromId, m]) => {
      const fromName = roster[fromId] ? roster[fromId].name : "(삭제된 학생)";
      return `<div class="rp-msg-preview">
        <div class="from">${fromName}</div>
        <div class="content">${escapeHtml(m.content)}</div>
      </div>`;
    })
    .join("");
}

function escapeHtml(str) {
  return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

// ---------- PDF 내보내기 ----------
$("templateSelect").innerHTML = Object.entries(TEMPLATES)
  .map(([key, t]) => `<option value="${key}">${t.label}</option>`)
  .join("");

$("fillMissingCheckbox").onchange = (e) => {
  $("fillMissingTextWrap").style.display = e.target.checked ? "" : "none";
};

async function buildEntries(toId) {
  const messages = await getMessagesFor(toId);
  const anon = $("nameDisplaySelect").value === "anon";
  const entries = Object.entries(messages).map(([fromId, m]) => ({
    fromName: anon ? null : roster[fromId] ? roster[fromId].name : "익명",
    content: m.content,
  }));

  if ($("fillMissingCheckbox").checked) {
    const fillerText = $("fillMissingText").value.trim();
    if (fillerText) {
      const writtenIds = new Set(Object.keys(messages));
      Object.entries(roster)
        .filter(([id]) => id !== toId && !writtenIds.has(id))
        .forEach(([, s]) => {
          entries.push({ fromName: anon ? null : s.name, content: fillerText });
        });
    }
  }
  return entries;
}

$("pdfSingleBtn").onclick = async () => {
  const toId = $("pdfSingleSelect").value;
  if (!toId) return;
  $("pdfSingleStatus").textContent = "PDF 생성 중...";
  try {
    const entries = await buildEntries(toId);
    const toName = roster[toId].name;
    await exportSingle(toName, entries, $("templateSelect").value, `롤링페이퍼_${toName}.pdf`);
    $("pdfSingleStatus").textContent = "";
  } catch (e) {
    console.error(e);
    $("pdfSingleStatus").textContent = "생성 중 오류가 발생했어요.";
  }
};

$("pdfBatchBtn").onclick = async () => {
  $("pdfBatchStatus").textContent = "전체 PDF 생성 중... (인원이 많으면 시간이 걸릴 수 있어요)";
  try {
    const list = await Promise.all(
      Object.entries(roster)
        .sort((a, b) => a[1].name.localeCompare(b[1].name, "ko"))
        .map(async ([id, s]) => ({ name: s.name, entries: await buildEntries(id) }))
    );
    await exportBatch(list, $("templateSelect").value, "롤링페이퍼_전체.pdf");
    $("pdfBatchStatus").textContent = "";
  } catch (e) {
    console.error(e);
    $("pdfBatchStatus").textContent = "생성 중 오류가 발생했어요.";
  }
};

} // initAdminApp 끝
</script>
</body>
</html>
